<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <!-- Short link picker.lutekops.ch/play (TikTok bio etc.): forwards straight to the Play listing.
       The referrer tags installs as utm_source=tiktok in Play Console > Acquisition.
       Meta refresh + play.js redirect; the badge is the fallback if both are blocked. -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=ch.lutekops.picker&amp;referrer=utm_source%3Dtiktok%26utm_medium%3Dbio">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Picker – Smart Decisions · Google Play</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/picker.css">
  <script src="play.js"></script>
</head>
<body>
<main class="tp-wrap">
  <h1>Picker – Smart Decisions</h1>
  <p>Opening Google Play …</p>
  <p><a class="play-badge" href="https://play.google.com/store/apps/details?id=ch.lutekops.picker&amp;referrer=utm_source%3Dtiktok%26utm_medium%3Dbio"><img src="../assets/badges/google-play-en.png" width="323" height="125" alt="Get it on Google Play"></a></p>
</main>
</body>
</html>
